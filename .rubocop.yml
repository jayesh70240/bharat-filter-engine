AllCops:
  NewCops: enable
  SuggestExtensions: false

Metrics/MethodLength:
  Max: 2000

Metrics/ClassLength:
  Max: 2000

Metrics/BlockLength:
  Max: 2000

Metrics/AbcSize:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 200

Metrics/PerceivedComplexity:
  Max: 200

Layout/LineLength:
  Max: 210

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  Exclude:
    - 'scripts/generate_release_docs.rb'
