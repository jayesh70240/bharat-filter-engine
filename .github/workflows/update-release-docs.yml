name: Update Release Documentation

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag to document'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-docs:
    name: Generate and review release documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LANG: C.UTF-8
      # Repository VARIABLES (non-secret). Everything except AI_MODEL has a default.
      AI_ENABLED: ${{ vars.AI_ENABLED }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MAX_REQUEST_TOKENS: ${{ vars.AI_MAX_REQUEST_TOKENS }}
      AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS }}
      AI_TOKENS_PER_MINUTE: ${{ vars.AI_TOKENS_PER_MINUTE }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch with full history and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Check script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .release-docs
          ruby -c scripts/generate_release_docs.rb

      - name: Install and start Ollama (only when AI_ENABLED=false)
        if: env.AI_ENABLED == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${OLLAMA_MODEL:-}" || { echo '::error::OLLAMA_MODEL is required when AI_ENABLED=false'; exit 1; }
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > .release-docs/ollama-server.log 2>&1 < /dev/null &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { cat .release-docs/ollama-server.log; exit 1; }
          ollama pull "$OLLAMA_MODEL" 2>&1 | tee .release-docs/ollama-pull.log

      - name: Generate documentation and open pull request
        shell: bash
        env:
          # Secrets are visible to this one step only; the script reads just the selected provider's key.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          ruby scripts/generate_release_docs.rb 2>&1 | tee .release-docs/run.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-docs-diagnostics-${{ github.run_id }}
          path: |
            .release-docs/run.log
            .release-docs/manifest.json
            .release-docs/implementation-summary.md
            .release-docs/ollama-server.log
            .release-docs/ollama-pull.log
          if-no-files-found: ignore
          retention-days: 14
