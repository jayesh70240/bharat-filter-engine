name: Update Release Documentation

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to document"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-docs-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest

    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve release and previous version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          RELEASE_TAG="${INPUT_TAG:-$PUSH_TAG}"

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid stable release tag: $RELEASE_TAG"
            exit 1
          fi

          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          VERSION="${RELEASE_TAG#v}"

          TAGS=$(git tag --list 'v[0-9]*' --sort=version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if ! printf '%s\n' "$TAGS" | grep -Fxq "$RELEASE_TAG"; then
            echo "Release tag not found: $RELEASE_TAG"
            exit 1
          fi

          PREVIOUS_TAG=$(printf '%s\n' "$TAGS" | awk -v target="$RELEASE_TAG" '
            $0 == target {
              print previous
              exit
            }
            {
              previous = $0
            }
          ')

          if test -n "$PREVIOUS_TAG"; then
            BASE="$PREVIOUS_TAG"
          else
            BASE=$(git hash-object -t tree /dev/null)
          fi

          {
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"

          echo "Release: $RELEASE_TAG"
          echo "Previous release: ${PREVIOUS_TAG:-None}"

      - name: Generate implementation and spec diffs
        id: changes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE" "$RELEASE_TAG" -- lib/; then
            echo "No lib/ changes found for $RELEASE_TAG"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          git diff --no-ext-diff --unified=80 \
            "$BASE" "$RELEASE_TAG" -- lib/ > lib.diff

          git diff --no-ext-diff --unified=40 \
            "$BASE" "$RELEASE_TAG" -- spec/ > specs.diff

          git diff --name-status \
            "$BASE" "$RELEASE_TAG" -- lib/ spec/ > changed-files.txt

          if ! test -s lib.diff; then
            echo "Implementation diff is empty."
            exit 1
          fi

          if ! test -f README.md || ! test -f CHANGELOG.md; then
            echo "README.md or CHANGELOG.md is missing."
            exit 1
          fi

          echo "Implementation and reference diffs generated."

      - name: Prepare Gemini documentation prompt
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          set -euo pipefail

          {
            cat <<EOF
          You are a senior Ruby and Ruby on Rails gem maintainer.

          Update the complete README.md and CHANGELOG.md for
          the Bharat Filter Engine gem.

          RELEASE INFORMATION
          Current release: $RELEASE_TAG
          Version: $VERSION
          Previous stable release: ${PREVIOUS_TAG:-First stable release}

          SOURCE OF TRUTH RULES

          1. lib/ IS THE ONLY SOURCE OF TRUTH.

          - Analyze actual implementation changes in lib/.
          - Determine public APIs, parameters, defaults, accepted values,
            operators, separators and behaviour from lib/.
          - Document only behaviour actually supported by lib/.
          - Never invent APIs, features or behaviour.

          2. spec/ IS REFERENCE ONLY.

          - Use spec/ only to understand intended usage and cross-check
            implementation behaviour.
          - Specs are not proof that a public feature exists.
          - Never document behaviour only because a spec tests it.
          - If spec/ and lib/ conflict, always follow lib/.
          - Never describe spec-only changes as release features.

          3. README.md

          - Return the complete updated README.
          - Preserve valid existing sections and explanations.
          - Update all outdated examples affected by lib/ changes.
          - Update parameter names, defaults, accepted values,
            separators, operators, syntax and return behaviour.
          - If a separator changes from comma to pipe, update all
            affected examples throughout the README.
          - Do not simply append a new section instead of updating
            existing documentation.
          - Do not remove unrelated valid documentation.

          4. CHANGELOG.md

          - Preserve all existing historical release entries.
          - Add a new entry for [$VERSION] at the top.
          - Include only user-facing changes supported by lib/.
          - Explain meaningful additions, fixes, behaviour changes
            and breaking changes.
          - Exclude CI, GitHub Actions, linting, workflow and
            repository maintenance changes.
          - Do not invent changes.

          5. OUTPUT FORMAT

          - Return complete README.md content.
          - Return complete CHANGELOG.md content.
          - Do not return snippets or patches.
          - Do not wrap the JSON in Markdown code fences.
          - Return valid JSON with exactly two string keys:
            readme and changelog.

          IMPLEMENTATION DIFF (PRIMARY SOURCE)
          ====================================
          EOF

            cat lib.diff

            cat <<'EOF'

          SPEC DIFF (REFERENCE ONLY - NOT SOURCE OF TRUTH)
          ================================================
          EOF

            if test -s specs.diff; then
              cat specs.diff
            else
              echo "No spec changes."
            fi

            cat <<'EOF'

          CHANGED FILES
          =============
          EOF

            cat changed-files.txt

            cat <<'EOF'

          EXISTING README.md
          ==================
          EOF

            cat README.md

            cat <<'EOF'

          EXISTING CHANGELOG.md
          =====================
          EOF

            cat CHANGELOG.md

          } > prompt.txt

          echo "Gemini prompt prepared."

      - name: Generate documentation with Gemini
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if test -z "$GEMINI_API_KEY"; then
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          fi

          if test -z "$GEMINI_MODEL"; then
            echo "GEMINI_MODEL repository variable is missing."
            exit 1
          fi

          jq -n \
            --rawfile prompt prompt.txt \
            '{
              contents: [
                {
                  role: "user",
                  parts: [
                    { text: $prompt }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.2,
                responseMimeType: "application/json",
                maxOutputTokens: 32768
              }
            }' > request.json

          API_URL="https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent"

          SUCCESS=false

          for ATTEMPT in $(seq 1 9); do
            echo "Gemini API attempt $ATTEMPT/9"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -d @request.json \
              -o response.json \
              -w "%{http_code}" || true)

            case "$HTTP_STATUS" in
              2??)
                SUCCESS=true
                echo "Gemini API request successful."
                break
                ;;
              429|500|502|503|504|000)
                echo "Temporary Gemini API error: HTTP $HTTP_STATUS"

                if test "$ATTEMPT" -lt 9; then
                  echo "Retrying after 10 seconds..."
                  sleep 10
                fi
                ;;
              *)
                echo "Gemini API returned HTTP $HTTP_STATUS"
                cat response.json 2>/dev/null || true
                exit 1
                ;;
            esac
          done

          if test "$SUCCESS" != "true"; then
            echo "Gemini API failed after 9 attempts."
            cat response.json 2>/dev/null || true
            exit 1
          fi

          jq -e '
            (.candidates | length) > 0 and
            (.candidates[0].finishReason == "STOP")
          ' response.json > /dev/null || {
            echo "Gemini did not return a complete response."
            jq '{promptFeedback, candidates: [.candidates[]? | {finishReason, finishMessage}]}' response.json
            exit 1
          }

          jq -er '
            [
              .candidates[0].content.parts[]?
              | select(has("text"))
              | .text
            ] | join("")
          ' response.json > generated.json

          jq -e '
            (.readme | type == "string") and
            (.readme | length > 500) and
            (.changelog | type == "string") and
            (.changelog | length > 100)
          ' generated.json > /dev/null || {
            echo "Gemini returned invalid or incomplete documentation."
            exit 1
          }

          echo "Documentation generated successfully."

      - name: Validate generated documentation
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          jq -r '.readme' generated.json > README.new.md
          jq -r '.changelog' generated.json > CHANGELOG.new.md

          if ! grep -Fq "## [$VERSION]" CHANGELOG.new.md; then
            echo "CHANGELOG is missing the release heading for $VERSION."
            exit 1
          fi

          OLD_README_SIZE=$(wc -c < README.md)
          NEW_README_SIZE=$(wc -c < README.new.md)
          OLD_CHANGELOG_SIZE=$(wc -c < CHANGELOG.md)
          NEW_CHANGELOG_SIZE=$(wc -c < CHANGELOG.new.md)

          if test "$NEW_README_SIZE" -lt "$((OLD_README_SIZE / 2))"; then
            echo "Generated README is unexpectedly smaller."
            exit 1
          fi

          if test "$NEW_CHANGELOG_SIZE" -lt "$((OLD_CHANGELOG_SIZE / 2))"; then
            echo "Generated CHANGELOG is unexpectedly smaller."
            exit 1
          fi

          while IFS= read -r heading; do
            if test -n "$heading"; then
              if ! grep -Fqx -- "$heading" CHANGELOG.new.md; then
                echo "Existing CHANGELOG heading was removed: $heading"
                exit 1
              fi
            fi
          done < <(grep '^## ' CHANGELOG.md || true)

          if ! test -s README.new.md || ! test -s CHANGELOG.new.md; then
            echo "Generated documentation is empty."
            exit 1
          fi

          echo "Documentation validation passed."

      - name: Apply documentation changes
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mv README.new.md README.md
          mv CHANGELOG.new.md CHANGELOG.md

          git diff --check

          git add README.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No documentation changes generated."
            exit 1
          fi

          git diff --cached --stat

      - name: Create documentation pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: docs/release-${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: "docs: update documentation for ${{ steps.release.outputs.release_tag }}"
          title: "docs: update documentation for ${{ steps.release.outputs.release_tag }}"
          body: |
            ## Release Documentation Update

            Automated documentation update for **${{ steps.release.outputs.release_tag }}**.

            ### Sources
            - `lib/` diff: primary source of truth.
            - `spec/` diff: reference only.
            - Existing README and CHANGELOG: preserved and updated.

            ### Changes
            - Updated complete README.
            - Updated CHANGELOG with the release entry.
            - Preserved historical changelog entries.

            Please review the generated documentation before merging.
          add-paths: |
            README.md
            CHANGELOG.md

      - name: Job summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          CHANGE_STATUS: ${{ steps.changes.outputs.has_changes }}
        run: |
          {
            echo "## Release Documentation"
            echo ""
            echo "- Release: ${RELEASE_TAG:-Not resolved}"
            echo "- Implementation changes: ${CHANGE_STATUS:-Not checked}"
            echo "- Specs: Reference only"
            echo "- Documentation: README.md and CHANGELOG.md"
            echo "- Python fallback: Disabled"
            echo "- Auto-merge: Disabled"
          } >> "$GITHUB_STEP_SUMMARY"
