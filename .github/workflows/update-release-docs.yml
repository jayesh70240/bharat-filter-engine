name: Update Release Documentation

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to document"
        required: true
        default: "v0.2.0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-docs:
    if: github.repository == 'jayesh70240/bharat-filter-engine'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r scripts/docs/requirements.txt

      - name: Analyze release
        id: analyze
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python scripts/docs/analyze_release.py
          HAS_CHANGES=$(python -c "import json; print(str(json.load(open('release-analysis.json'))['has_lib_changes']).lower())")
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Generate documentation
        if: steps.analyze.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/docs/generate_docs.py

      - name: Validate documentation
        if: steps.analyze.outputs.has_changes == 'true'
        run: python scripts/docs/validate_docs.py

      - name: Create documentation PR
        if: steps.analyze.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: docs/release-${{ inputs.release_tag || github.ref_name }}
          delete-branch: true
          add-paths: |
            README.md
            CHANGELOG.md
          commit-message: "docs: update release documentation for ${{ inputs.release_tag || github.ref_name }}"
          title: "docs: release documentation for ${{ inputs.release_tag || github.ref_name }}"
          body: |
            ## Release documentation update

            Automatically generated documentation for `${{ inputs.release_tag || github.ref_name }}`.

            ### Changes
            - Analyzed actual `lib/` source changes.
            - Used specs as supporting evidence.
            - Updated README and CHANGELOG.
            - Validated generated documentation.

            Please review the changes before merging.

            This PR is not automatically merged.
