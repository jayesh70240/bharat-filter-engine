name: Update Release Documentation

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag to document'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-docs:
    name: Generate and review release documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      AI_ENABLED: ${{ vars.AI_ENABLED }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      AI_REQUEST_INTERVAL_SECONDS: ${{ vars.AI_REQUEST_INTERVAL_SECONDS || '65' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch and full Git history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Initialize diagnostics directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .release-docs
          {
            echo '## Release documentation run'
            echo
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Requested tag: ${RELEASE_TAG}"
            echo "- Backend flag: ${AI_ENABLED:-missing}"
            echo "- Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate backend configuration
        shell: bash
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          GROQ_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.GROQ_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.CEREBRAS_API_KEY || '' }}
          GEMINI_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.GEMINI_API_KEY || '' }}
        run: |
          set -Eeuo pipefail

          case "${AI_ENABLED:-}" in
            true)
              test -n "${AI_MODEL:-}" || { echo 'AI_MODEL is required.'; exit 1; }
              case "${AI_PROVIDER:-}" in
                groq) test -n "${GROQ_API_KEY:-}" || { echo 'GROQ_API_KEY is required.'; exit 1; } ;;
                openrouter) test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is required.'; exit 1; } ;;
                cerebras) test -n "${CEREBRAS_API_KEY:-}" || { echo 'CEREBRAS_API_KEY is required.'; exit 1; } ;;
                gemini) test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY is required.'; exit 1; } ;;
                *) echo "Unsupported AI_PROVIDER: ${AI_PROVIDER:-missing}"; exit 1 ;;
              esac
              ;;
            false)
              test -n "${OLLAMA_MODEL:-}" || { echo 'OLLAMA_MODEL is required.'; exit 1; }
              ;;
            *)
              echo 'AI_ENABLED must be exactly true or false.'
              exit 1
              ;;
          esac

      - name: Validate Ruby script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby --version
          ruby -c scripts/generate_release_docs.rb
          command -v git
          command -v curl
          command -v gh

      - name: Install and start Ollama
        if: env.AI_ENABLED == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo '::group::Install Ollama'
          curl --fail --silent --show-error https://ollama.com/install.sh | sh
          echo '::endgroup::'

          echo '::group::Start Ollama service'
          if ! curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > .release-docs/ollama-server.log 2>&1 &
            echo "$!" > .release-docs/ollama.pid
          else
            echo 'Ollama service was already running.'
          fi

          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo 'Ollama did not become ready within 180 seconds.'
            cat .release-docs/ollama-server.log || true
            exit 1
          fi
          echo 'Ollama service is ready.'
          echo '::endgroup::'

          echo '::group::Pull configured Ollama model'
          ollama pull "$OLLAMA_MODEL" 2>&1 | tee .release-docs/ollama-pull.log
          echo '::endgroup::'

      - name: Generate documentation and create pull request
        id: generate
        shell: bash
        env:
          GROQ_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.GROQ_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.OPENROUTER_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.CEREBRAS_API_KEY || '' }}
          GEMINI_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.GEMINI_API_KEY || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -Eeuo pipefail
          ruby scripts/generate_release_docs.rb 2>&1 | tee .release-docs/run.log

      - name: Upload execution diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-docs-diagnostics-${{ github.run_id }}
          path: |
            .release-docs/run.log
            .release-docs/ollama-server.log
            .release-docs/ollama-pull.log
            .release-docs/manifest.json
          if-no-files-found: ignore
          retention-days: 14
